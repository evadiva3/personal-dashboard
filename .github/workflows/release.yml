name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    # Apple Silicon only, matching this app's current support (aarch64 macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Canvas Hub ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
